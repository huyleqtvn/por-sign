# Checks each push to main and each pull request as CONTRIBUTING.md › Commands says, then runs the command-line
# tests again on the bundle the build wrote, dist/por-sign.mjs. Each action is pinned to a commit.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - name: The command-line tests, on the bundle
        run: pnpm test test/cli.test.ts
        env:
          POR_SIGN: dist/por-sign.mjs
